spring.application.name=analytics

# The repo's .env (RPC keys), whether started from analytics/ (bootRun) or from the repo root.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Postgres from the root docker-compose.yml (host port 5434).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/hft}
spring.datasource.username=${DB_USER:hft}
spring.datasource.password=${DB_PASSWORD:hft}

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ZeroMQ PUB endpoint of the C++ bot (telemetry.zmq_endpoint in core/config/arbitrum.json).
hft.bot.events-endpoint=${BOT_EVENTS_ENDPOINT:tcp://127.0.0.1:5555}
hft.bot.listener-enabled=true

# Read-only chain access for pool discovery and history (web3j). Same chain as the bot.
# Research is bulk work, not latency sensitive: it uses the public endpoint by default and
# leaves the provider key in .env (ARBITRUM_RPC_URL) to the bot. Free provider plans meter
# compute units per second and cap eth_getLogs ranges (Alchemy: 10 blocks).
hft.chain.rpc-url=${ARBITRUM_RESEARCH_RPC_URL:https://arb1.arbitrum.io/rpc}
hft.chain.logs-rpc-url=${ARBITRUM_LOGS_RPC_URL:${hft.chain.rpc-url}}
hft.chain.max-calls-per-second=20
